name: Build Mishra Gym Planner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project folders
        run: |
          mkdir -p app/src/main/java/com/mishragym/planner
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MishraGymPlanner"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mishragym.planner'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mishragym.planner'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Mishra Gym Planner"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="gym_red">#FF1744</color>
              <color name="gym_dark">#101010</color>
              <color name="gym_card">#1E1E1E</color>
              <color name="gym_green">#00E676</color>
          </resources>
          EOF

      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF1744</item>
                  <item name="android:navigationBarColor">#101010</item>
                  <item name="android:statusBarColor">#101010</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/mishragym/planner/MainActivity.java <<'EOF'
          package com.mishragym.planner;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              LinearLayout layout;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.rgb(16,16,16));

                  layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(35,35,35,35);

                  scroll.addView(layout);

                  createApp();

                  setContentView(scroll);
              }

              TextView title(String text, int size) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  t.setPadding(10,20,10,20);
                  return t;
              }

              EditText input(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(Color.GRAY);
                  e.setTextColor(Color.WHITE);
                  e
